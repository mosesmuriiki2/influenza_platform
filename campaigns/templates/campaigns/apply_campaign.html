{% extends 'accounts/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Apply for Campaign: {{ campaign.title }}</h4>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <img src="{{ campaign.image.url }}" alt="{{ campaign.title }}" 
                             class="img-thumbnail campaign-thumbnail" 
                             style="max-width: 200px; cursor: pointer"
                             onclick="showFullImage('{{ campaign.image.url }}')">
                    </div>
                    
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="form-group mt-4">
                            <button type="submit" class="btn btn-primary btn-block">Submit Application</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal for full image view -->
<div class="modal fade" id="imageModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ campaign.title }}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body text-center">
                <img id="fullImage" src="" class="img-fluid" alt="Campaign Image">
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    function showFullImage(imageUrl) {
        $('#fullImage').attr('src', imageUrl);
        $('#imageModal').modal('show');
    }
</script>
{% endblock %}
